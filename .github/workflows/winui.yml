# Builds the WinUI 3 app as a signed sideload MSIX (x64 + ARM64) and publishes it as a GitHub release.
#
# Triggers:
#   - pushing a tag winui-<major>.<minor>.<build>, e.g. winui-1.6.0
#   - running the workflow manually (the tag is derived from the manifest version)
# The version comes from Package.appxmanifest. Its Identity Version must be <major>.<minor>.<build>.0
# and, for a tag push, must match the tag, otherwise the workflow fails.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   BASE64_ENCODED_PFX  base64 of the code-signing .pfx whose subject is CN=DryForest
#   PFX_PASSWORD        password of that .pfx (leave unset if the .pfx has no password)

name: Build WinUI sideload app

on:
  workflow_dispatch:
  push:
    tags:
      - 'winui-[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  Manifest_Path: AoE2DELobbyBrowser/Package.appxmanifest

jobs:

  version:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Get and check app version
      id: version
      shell: pwsh
      run: |
        [xml]$manifest = Get-Content $env:Manifest_Path
        $manifestVersion = [version]$manifest.Package.Identity.Version
        if ($manifestVersion.Revision -ne 0) {
          throw "Manifest version $manifestVersion must end in .0 (MSIX reserves the revision number)."
        }
        $version = $manifestVersion.ToString(3)
        if ($env:GITHUB_REF_TYPE -eq 'tag') {
          $tagVersion = $env:GITHUB_REF_NAME -replace '^winui-', ''
          if ($tagVersion -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match manifest version $manifestVersion. Update the manifest or the tag."
          }
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "WinUI version: $version"

  build:
    needs: version
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    env:
      Project_Path: AoE2DELobbyBrowser/AoE2DELobbyBrowser.csproj
      Package_Dir: ${{ github.workspace }}\winui-packages\
      App_Version: ${{ needs.version.outputs.version }}
      # Sideload identity, distinct from the Store identity so both can be installed side by side.
      # The publisher must match the subject of the signing certificate.
      MsixPackageId: DryForest.AoE2DELobbyBrowser
      MsixPublisherId: CN=DryForest
      ToastActivatorCLSID: 126CBD31-FDF5-4652-BB2A-8624CEC6E7AD

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set sideload identity in manifest
      run: |
        $path = (Resolve-Path $env:Manifest_Path).Path
        [xml]$manifest = Get-Content $path
        $manifest.Package.Identity.Name = $env:MsixPackageId
        $manifest.Package.Identity.Publisher = $env:MsixPublisherId
        $ext = $manifest.Package.Applications.Application.Extensions.Extension
        $ext[0].ToastNotificationActivation.ToastActivatorCLSID = $env:ToastActivatorCLSID
        $ext[1].ComServer.ExeServer.Class.Id = $env:ToastActivatorCLSID
        $manifest.Save($path)

    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    # MSBuild's own signing can't import password-protected PFX files on the runner (APPX0105/APPX0107),
    # so the certificate goes into the user store and SignTool signs the package after the build.
    - name: Import signing certificate
      env:
        PFX_BASE64: ${{ secrets.BASE64_ENCODED_PFX }}
        PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
      run: |
        if (-not $env:PFX_BASE64) { throw "Repository secret BASE64_ENCODED_PFX is not set." }
        $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]'UserKeySet, PersistKeySet'
        try {
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($env:PFX_BASE64), $env:PFX_PASSWORD, $flags)
        } catch {
          throw "Cannot open the PFX from BASE64_ENCODED_PFX. Check that PFX_PASSWORD matches it. $_"
        }
        if (-not $cert.HasPrivateKey) { throw "The PFX has no private key." }
        if ($cert.Subject -ne $env:MsixPublisherId) {
          throw "Certificate subject '$($cert.Subject)' must match the manifest publisher '$env:MsixPublisherId'."
        }
        $store = [Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
        $store.Open('ReadWrite')
        $store.Add($cert)
        $store.Close()
        $cerPath = Join-Path $env:RUNNER_TEMP 'AoE2DELobbyBrowser.cer'
        [IO.File]::WriteAllBytes($cerPath, $cert.Export('Cert'))
        echo "Cert_Thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_ENV
        echo "Cer_Path=$cerPath" >> $env:GITHUB_ENV

    # Self-contained .NET and Windows App SDK: users need no runtime installed besides the MSIX itself.
    # App notifications (AppNotificationManager) work self-contained; the package identity and the
    # manifest's COM activator handle toast activation.
    - name: Build and package MSIX
      run: >-
        msbuild $env:Project_Path /restore /v:minimal
        /p:Configuration=Release
        /p:Platform=${{ matrix.platform }}
        /p:RuntimeIdentifier=${{ matrix.rid }}
        /p:SelfContained=true
        /p:WindowsAppSDKSelfContained=true
        /p:GenerateAppxPackageOnBuild=true
        /p:UapAppxPackageBuildMode=SideloadOnly
        /p:AppxBundle=Never
        /p:AppxPackageDir="$env:Package_Dir"
        /p:AppxPackageSigningEnabled=false

    - name: Collect and sign package
      run: |
        New-Item -ItemType Directory -Force out | Out-Null
        $msix = @(Get-ChildItem $env:Package_Dir -Recurse -Filter *.msix)
        if ($msix.Count -ne 1) { throw "Expected one .msix, found $($msix.Count)." }
        $arch = '${{ matrix.platform }}'.ToLowerInvariant()
        $target = "out/AoE2DELobbyBrowser-WinUI-$env:App_Version-$arch.msix"
        Copy-Item $msix[0].FullName $target
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
        if (-not $signtool) { throw "signtool.exe not found in the Windows SDK." }
        & $signtool.FullName sign /fd SHA256 /sha1 $env:Cert_Thumbprint /s My `
          /tr http://timestamp.digicert.com /td SHA256 $target
        if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }
        # The public certificate is the same for every architecture, so publish it once.
        if ($arch -eq 'x64') { Copy-Item $env:Cer_Path out/AoE2DELobbyBrowser.cer }
        Get-ChildItem out

    - name: Remove signing certificate
      if: always()
      run: |
        if ($env:Cert_Thumbprint) {
          $store = [Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
          $store.Open('ReadWrite')
          $store.Certificates.Find('FindByThumbprint', $env:Cert_Thumbprint, $false) |
            ForEach-Object { $store.Remove($_) }
          $store.Close()
        }

    - name: Upload package
      uses: actions/upload-artifact@v6
      with:
        name: winui-${{ matrix.platform }}
        path: out/*
        if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: windows-latest

    env:
      App_Version: ${{ needs.version.outputs.version }}

    steps:
    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        path: release
        merge-multiple: true

    - name: Create or update the GitHub release
      uses: ncipollo/release-action@v1
      with:
        tag: winui-${{ env.App_Version }}
        name: WinUI ${{ env.App_Version }}
        commit: ${{ github.sha }}
        artifacts: release/*
        # GitHub appends the generated release notes after this body.
        body: |
          ## Install

          1. Download `AoE2DELobbyBrowser.cer` and the `.msix` for your PC: `x64` for most PCs, `arm64` for Windows on ARM.
          2. Trust the certificate once (needs admin): open the `.cer`, choose **Install Certificate** > **Local Machine** > **Place all certificates in the following store** > **Trusted People**.
             Or run in an elevated PowerShell: `Import-Certificate -FilePath AoE2DELobbyBrowser.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople`
          3. Open the `.msix` and click **Install**. To update later, install the newer `.msix` the same way.
        generateReleaseNotes: true
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
